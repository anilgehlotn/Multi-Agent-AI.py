services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Relative sqlite path resolves against /app (= backend/) inside the
      # container, landing in the backend_db volume mount below.
      - DATABASE_URL=sqlite:///./db_data/researchmind.db
    volumes:
      # Persist uploaded PDFs + Chroma indices, and the SQLite DB, across restarts.
      - backend_data:/app/data
      - backend_db:/app/db_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_db:
